<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#173f35" />
    <title>Cribbit Dashboard</title>
    <script src="https://telegram.org/js/telegram-web-app.js?63"></script>
    <link rel="stylesheet" href="/styles.css" />
    <script src="/app.js" defer></script>
  </head>
  <body>
    <main class="shell">
      <header class="hero">
        <div>
          <p class="eyebrow">YOUR SHARED HOME</p>
          <h1>Cribbit</h1>
          <p class="subtitle">Balances, expenses and chores—without leaving Telegram.</p>
        </div>
        <div class="frog" aria-hidden="true">🐸</div>
      </header>

      <div id="status" class="status">Loading your household…</div>

      <section id="dashboard" hidden>
        <div class="summary-grid">
          <article class="summary-card accent">
            <span>Total spent</span>
            <strong id="total-spent">$0.00</strong>
          </article>
          <article class="summary-card">
            <span>Housemates</span>
            <strong id="member-count">0</strong>
          </article>
          <article class="summary-card">
            <span>Open chores</span>
            <strong id="open-chores">0</strong>
          </article>
        </div>

        <section class="panel">
          <div class="section-heading">
            <div><span>SETTLE UP</span><h2>Who pays whom</h2></div>
          </div>
          <div id="settlements" class="stack"></div>
        </section>

        <section class="panel">
          <div class="section-heading">
            <div><span>RECENT</span><h2>Expenses</h2></div>
            <span id="expense-count" class="pill">0</span>
          </div>
          <div id="expenses" class="stack"></div>
        </section>

        <section class="panel">
          <div class="section-heading">
            <div><span>HOUSE</span><h2>Chores</h2></div>
            <span id="chore-count" class="pill">0</span>
          </div>
          <div id="chores" class="stack"></div>
        </section>
      </section>
    </main>
  </body>
</html>
